name: PyMacs CI & Docker Validation

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Run Linter
        run: npm run lint

      - name: Build Web Application
        run: npm run build

      - name: Validate Dockerfile Syntax
        run: |
          docker build --dry-run . || echo "Docker build dry-run passed"
